name: Frontend CI

on: [push, pull_request]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: "mock_api_key_for_ci_build"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mock-project.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mock-project"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "mock-project.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:1234567890abcdef"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Build production bundle
        run: npm run build
